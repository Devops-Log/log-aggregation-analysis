services:
  mongodb:
    image: mongo:7
    container_name: centrallog-mongodb
    env_file:
      - ./mongo.env
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "db.adminCommand({ ping: 1 })"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: centrallog-backend:latest
    container_name: centrallog-backend
    env_file:
      - ./backend/.env.local
    ports:
      - "5000:5000"
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    image: centrallog-frontend:latest
    container_name: centrallog-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongo-data:
    name: centrallog-mongo-data

networks:
  default:
    name: centrallog-network